# Full stack: Postgres + Liquibase migrate + PostgREST + nginx (UI + /api).
# Host ports: Postgres ${POSTGRES_PUBLIC_PORT:-54321}→5432, nginx 7777. Local Vite/PostgREST: ./launch.sh (uses .env PGPORT, usually 5432).
# Build the UI first (`npm run build`) so ./dist is ready for the nginx volume.
#
#   npm run build && docker compose up
#   open http://localhost:7777${VITE_BASE_PATH:-/postgresto}/

name: ${AppName:-postgresto}

services:
  dbms:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: ${AppName:-postgresto}-dbms
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      # Created on first volume init.
      POSTGRES_DB: ${PGDATABASE:-postgresto-local}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    ports:
      - '${POSTGRES_PUBLIC_PORT:-54321}:5432'
    # volumes:
    #   # PG 18+ expects the mount at /var/lib/postgresql (versioned subdir inside).
    #   - postgresto_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - postgres

  migrate:
    image: liquibase/liquibase:${LIQUIBASE_VERSION:-5.0}
    container_name: ${AppName:-postgresto}-migrate
    environment:
      PGHOST: ${PGHOST:-dbms}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-postgresto-local}
      PGSCHEMAS: ${PGSCHEMAS:-postgresto,docs,public}
      VITE_CONFIG_TABLE: ${VITE_CONFIG_TABLE:-config}
      VITE_MENU_TABLE: ${VITE_MENU_TABLE:-menu}
      VITE_VIEW_TABLE: ${VITE_VIEW_TABLE:-view}
      VITE_SEARCH_TABLE: ${VITE_SEARCH_TABLE:-search}
      CONTEXTS: ${CONTEXTS:-}
    volumes:
      - ./scripts:/liquibase/changelog
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -e
        lpm add postgresql --global
        /liquibase/changelog/applyLiquibase.sh
    depends_on:
      dbms:
        condition: service_healthy
    restart: 'no'

  api:
    # Scratch image — no /bin/sh; do not override entrypoint with a shell script.
    image: postgrest/postgrest:${POSTGREST_VERSION:-v16.4}
    container_name: ${AppName:-postgresto}-api
    environment:
      PGRST_DB_URI: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@${PGHOST:-dbms}:${PGPORT:-5432}/${PGDATABASE:-postgresto-local}
      PGRST_DB_SCHEMAS: postgresto,${PGSCHEMAS:-postgresto,docs,public}
      # Default: postgres (not locked-down anon). Override with PGRST_DB_ANON_ROLE=anon if needed.
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-postgres}
      # Optional JWT — pass through from host/.env only when set (empty string is OK on PostgREST 16+).
      # $$ → literal $ in Compose (JSONPath $.role).
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-}
      PGRST_JWT_ROLE_CLAIM_KEY: ${PGRST_JWT_ROLE_CLAIM_KEY:-$$.role}
      PGRST_DB_AGGREGATES_ENABLED: 'true'
      PGRST_SERVER_PORT: '3000'
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:7777/postgresto/api
    depends_on:
      migrate:
        condition: service_completed_successfully
      dbms:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:${NGINX_VERSION:-latest}
    container_name: ${AppName:-postgresto}-nginx
    environment:
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/postgresto}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      # Only substitute app deploy vars; leave nginx $vars / ${vars} untouched.
      NGINX_ENVSUBST_FILTER: VITE_BASE_PATH|VITE_OIDC_AUTHORITY|VITE_OIDC_CLIENT_ID
    ports:
      - '7777:80'
    volumes:
      - ./dist:/usr/share/nginx/html${VITE_BASE_PATH:-/postgresto}:ro
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    restart: unless-stopped

