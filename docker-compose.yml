  #     KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
  #   ports:
  #     - '127.0.0.1:${KEYCLOAK_PUBLIC_PORT:-8080}:8080'
  #   restart: unless-stopped

